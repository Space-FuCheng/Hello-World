name: Build Chrono Volume Fix ARM64 Release APK
on:
  push:
    branches:
      - chrono-volfix-build-20261027
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
      - name: Checkout upstream Chrono v0.6.0
        uses: actions/checkout@v4
        with:
          repository: vicolo-dev/chrono
          ref: v0.6.0
          path: chrono
          persist-credentials: false
      - name: Apply fix
        run: cp chrono-build/ringtone_player.dart chrono/lib/audio/types/ringtone_player.dart
      - name: Pin AndroidX LiveData version for legacy Android Gradle plugin
        run: |
          cat >> chrono/android/build.gradle <<'GRADLE'

          // Work around D8 incompatibility between AGP 7.4.2 and LiveData 2.8.5
          // in Chrono v0.6.0. Keep this isolated to the experimental build.
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.lifecycle:lifecycle-livedata-core:2.6.1'
                  }
              }
          }
          GRADLE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
      - name: Override old D8 and R8 used by AGP 7.4.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('chrono/android/settings.gradle')
          text = p.read_text()
          marker = 'pluginManagement {'
          assert text.count(marker) == 1
          replacement = """pluginManagement {
              buildscript {
                  repositories {
                      mavenCentral()
                      maven { url = uri("https://storage.googleapis.com/r8-releases/raw") }
                  }
                  dependencies {
                      classpath("com.android.tools:r8:8.1.44")
                  }
              }"""
          p.write_text(text.replace(marker, replacement, 1))
          print('Added R8 8.1.44 override to settings.gradle')
          PY
      - name: Install dependencies
        working-directory: chrono
        run: flutter pub get
      - name: Sign experimental release APK with temporary debug keystore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("chrono/android/app/build.gradle")
          src = p.read_text()
          needle = "signingConfig signingConfigs.release"
          assert src.count(needle) == 1, "Expected one release signing config"
          p.write_text(src.replace(needle, "signingConfig signingConfigs.debug"))
          PY
      - name: Build optimized ARM64 release APK (dev variant)
        working-directory: chrono
        run: flutter build apk --release --flavor dev --target-platform android-arm64 --split-per-abi
      - name: Report APK size
        run: |
          ls -lh chrono/build/app/outputs/flutter-apk/*-release.apk
          du -h chrono/build/app/outputs/flutter-apk/*-release.apk
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: chrono-v0.6.0-volume-fix-arm64-release
          path: chrono/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
